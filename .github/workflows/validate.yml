name: Validate flags

on:
  pull_request:
    paths:
      - "flags/**"
      - "segments/**"
      - "tests/**"
      - "packages/**"
      - "worker/**"
      - "action/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Core tests (no install needed)
        run: npm test
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Validate flag and segment files
        run: npm run validate
      - name: Run flag fixtures
        run: npm run check
      - name: Typecheck, SDK and Worker tests
        run: npm run typecheck && npm run test:sdk && npm run test:worker

  preview:
    name: Post flag preview comment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      # Dogfood the same composite action customers use.
      - uses: ./action
        with:
          command: preview
