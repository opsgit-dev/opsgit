name: Release packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) with provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test && npm run test:sdk && npm run test:worker
      - name: Check tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/core packages/sdk packages/cli; do
            v=$(node -p "require('./$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "::error::$p is $v but tag is $tag"; exit 1; }
          done
      - name: Publish (skips versions already on the registry)
        run: |
          for pkg in @opsgit/core @opsgit/flags-sdk opsgit-flags; do
            v=$(npm view "$pkg@${GITHUB_REF_NAME#v}" version 2>/dev/null || true)
            if [ -n "$v" ]; then echo "$pkg@$v already published, skipping"; continue; fi
            npm publish -w "$pkg" --provenance --access public
          done
      - name: Move the major tag for the GitHub Action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          major="v${GITHUB_REF_NAME#v}"; major="${major%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
