name: Deploy flags

on:
  push:
    branches: [main]
    paths:
      - "flags/**"
      - "segments/**"
      - "packages/**"
      - "worker/**"
      - "action/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a later push waits for the earlier one.
concurrency:
  group: deploy-flags
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      # Dogfood the same composite action customers use.
      - uses: ./action
        with:
          command: deploy
          worker-name: opsgit-flags
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
