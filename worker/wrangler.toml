name = "opsgit-flags"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = true

[vars]
# Comma separated list of origins allowed to call the API from a browser, or "*".
ALLOWED_ORIGINS = "*"

# Secrets (never put these here, set them with `wrangler secret put <NAME>`):
#   SERVER_KEYS  comma separated keys for backends; may download the full bundle
#   CLIENT_KEYS  comma separated keys for browsers and mobile apps; may only evaluate

# Per client key + IP limit. Server keys are not limited. Period must be 10 or 60 seconds.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Evaluation analytics are opt-in because the account must enable Analytics Engine first.
# See worker/analytics.toml and the action's `analytics` input.
